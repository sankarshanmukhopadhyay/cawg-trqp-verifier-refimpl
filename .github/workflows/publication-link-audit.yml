name: Public Documentation Link Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  site-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Crawl deployed Pages and discover external failures
        run: python scripts/audit_public_links.py --output publication-link-audit.json
      - name: Upload link-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-link-audit
          path: publication-link-audit.json
          if-no-files-found: warn
