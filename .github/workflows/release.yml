name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - portfolio/integration-contract.json
      - conformance/**
      - scripts/**
      - tests/**
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve release identity
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('pyproject.toml').read_text()
          print(re.search(r'^version\s*=\s*"([^"]+)"', text, re.M).group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stop if release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install release tooling
        if: steps.existing.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip build
          pip install -r requirements-lock.txt
          pip install -e .

      - name: Run authoritative repository gate
        if: steps.existing.outputs.exists == 'false'
        run: make validate

      - name: Generate and verify release evidence
        if: steps.existing.outputs.exists == 'false'
        run: |
          python scripts/generate_release_checksums.py
          python scripts/generate_release_checksums.py --check
          python -m build

      - name: Verify versioned publication material
        if: steps.existing.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          test -s "RELEASE_NOTES_${TAG}.md"
          test -s "release-assets/checksums-${TAG}.json"
          test -n "$(ls -1 dist/*.whl)"
          test -n "$(ls -1 dist/*.tar.gz)"

      - name: Publish GitHub release as latest
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "CAWG-TRQP Verifier v$VERSION — Experimental Delegated Creator and Assurance Evidence" \
            --notes-file "RELEASE_NOTES_$TAG.md" \
            dist/* "release-assets/checksums-$TAG.json"

      - name: Confirm published release identity
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          test "$(gh release view "$TAG" --json tagName --jq '.tagName')" = "$TAG"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" = "$TAG"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "checksums-$TAG.json"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "cawg_trqp_refimpl-${TAG#v}-py3-none-any.whl"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "cawg_trqp_refimpl-${TAG#v}.tar.gz"
